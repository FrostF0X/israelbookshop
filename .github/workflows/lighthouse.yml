name: Lighthouse CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    name: Run Lighthouse Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pageName: 'homepage'
            path: '/'
          - pageName: 'category'
            path: '/collections/calendars'
          - pageName: 'product'
            path: '/collections/calendars/products/hebrew-illuminations-16-month-2026-2027-wall-calendar-and-candle-lighting-times'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Lighthouse Analysis
        run: node run-lighthouse.js "${{ matrix.path }}" "${{ matrix.pageName }}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-${{ matrix.pageName }}
          path: |
            lighthouse-report-${{ matrix.pageName }}.html
            lighthouse-report-${{ matrix.pageName }}.json
          retention-days: 1

  merge-and-deploy:
    needs: analyze
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all Lighthouse artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lighthouse-*
          path: public/lighthouse-reports-${{ github.run_id }}
          merge-multiple: true

      - name: Copy latest homepage report to root for GEMINI.md
        run: |
          cp public/lighthouse-reports-${{ github.run_id }}/lighthouse-report-homepage.html public/lighthouse-report.html || true
          cp public/lighthouse-reports-${{ github.run_id }}/lighthouse-report-homepage.json public/lighthouse-report.json || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: true
