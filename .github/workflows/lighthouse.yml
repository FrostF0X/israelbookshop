name: Lighthouse CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    name: Run Lighthouse Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Lighthouse Analysis
        run: node run-lighthouse.js

      - name: Upload Lighthouse HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report-html
          path: lighthouse-report.html

      - name: Upload Lighthouse JSON Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report-json
          path: lighthouse-report.json

      - name: Prepare Pages directory
        if: always()
        run: |
          mkdir -p public
          cp lighthouse-report.html public/ || true
          cp lighthouse-report.html public/lighthouse-report-${{ github.run_id }}.html || true
          cp lighthouse-report.json public/lighthouse-report-${{ github.run_id }}.json || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: true
